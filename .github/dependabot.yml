# Keeps the pinned things current (REM-14): actions by SHA, base images by digest, and the lock files.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
  - package-ecosystem: terraform
    directory: /terraform/cluster
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /terraform/addons
    schedule:
      interval: weekly
