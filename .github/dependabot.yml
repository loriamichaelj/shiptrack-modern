# Keeps the pinned things current (REM-14): actions by SHA, base images by digest, and the lock files.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The UI build must use the Node version in web/.nvmrc, the same one legacy builds with
      # (cutover gate G6). web/ is frozen until Wave 2 completes, so Node moves with it, not before.
      - dependency-name: node
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
    ignore:
      # web/ is frozen until Wave 2 completes so both stacks serve one UI build (gate G6). Remove
      # this entry when the freeze ends.
      - dependency-name: "*"
  - package-ecosystem: terraform
    directory: /terraform/cluster
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /terraform/addons
    schedule:
      interval: weekly
