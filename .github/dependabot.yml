# Keeps the pinned things current (REM-14): actions by SHA, base images by digest, and the lock files.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The UI build must use the Node version in web/.nvmrc. The freeze that tied it to legacy's UI
      # build (cutover gate G6) is over, ADR-0024; this entry stays until Node updates are wanted.
      - dependency-name: node
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
    ignore:
      # The freeze on web/ for gate G6 is over (ADR-0024). Remove this entry to let Dependabot
      # propose npm updates for the UI.
      - dependency-name: "*"
  - package-ecosystem: terraform
    directory: /terraform/cluster
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /terraform/addons
    schedule:
      interval: weekly
