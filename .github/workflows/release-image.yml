name: release-image

# Builds the image for each architecture on a native runner (no QEMU), pushes the per-architecture
# digests to ECR, checks that both images carry the same UI assets, merges them into one multi-arch
# tag, and scans the pushed digest. The merged digest is what deploys; tags are only for people.
# ECR tags are immutable, so a rerun for the same commit finds the tag and stops.
#
# After the scan, the merged index is copied unchanged to GHCR for the Azure and GCP targets (ADR-0034).
# That job cannot fail the release: deploy-app follows this workflow and AWS must not wait on GHCR.
#
# The UI is modern's own build and is not held to legacy's (ADR-0024); the check here is that amd64
# and arm64 agree, so a hash cannot differ by architecture.

on:
  push:
    branches:
      - dev
    paths:
      - "src/**"
      - "migrations/**"
      - "web/**"
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - "alembic.ini"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dev
  cancel-in-progress: false

env:
  TRIVY_VERSION: "v0.74.0"
  CRANE_VERSION: "v0.22.1"
  # SHA-256 of go-containerregistry_Linux_x86_64.tar.gz, from the release's checksums.txt.
  CRANE_SHA256: "0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0"
  REPOSITORY: shiptrack/app

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      - name: Log in to ECR and name the repository
        id: ecr
        run: |
          registry=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com
          echo "::add-mask::$registry"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          echo "repo=$registry/$REPOSITORY" >>"$GITHUB_OUTPUT"
      - name: Stop if this commit is already released
        id: exists
        env:
          REPO: ${{ steps.ecr.outputs.repo }}
        run: |
          if docker buildx imagetools inspect "${REPO}:sha-${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "sha-${GITHUB_SHA} is already in ECR; nothing to build."
            echo "released=true" >>"$GITHUB_OUTPUT"
          else
            echo "released=false" >>"$GITHUB_OUTPUT"
          fi
      - name: Create a builder
        if: steps.exists.outputs.released == 'false'
        run: docker buildx create --name release --driver docker-container --use
      - name: Build and push by digest
        if: steps.exists.outputs.released == 'false'
        env:
          REPO: ${{ steps.ecr.outputs.repo }}
          ARCH: ${{ matrix.arch }}
        run: |
          created=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          docker buildx build \
            --platform "linux/${ARCH}" \
            --provenance=false \
            --build-arg "REVISION=${GITHUB_SHA}" \
            --build-arg "CREATED=${created}" \
            --build-arg "VERSION=sha-${GITHUB_SHA}" \
            --output "type=image,name=${REPO},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "$RUNNER_TEMP/build.json" \
            .
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/build.json")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no digest in the build metadata" >&2; exit 1; }
          mkdir -p out
          echo "$digest" >"out/digest-${ARCH}"
      - name: List the UI assets in the pushed image
        if: steps.exists.outputs.released == 'false'
        env:
          REPO: ${{ steps.ecr.outputs.repo }}
          ARCH: ${{ matrix.arch }}
        run: |
          digest=$(cat "out/digest-${ARCH}")
          docker pull --quiet "${REPO}@${digest}" >/dev/null
          docker run --rm --entrypoint ls "${REPO}@${digest}" /app/web/dist/assets | sort >"out/assets-${ARCH}.txt"
          cat "out/assets-${ARCH}.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.exists.outputs.released == 'false'
        with:
          name: build-${{ matrix.arch }}
          path: out/
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        id: download
        with:
          pattern: build-*
          path: builds
          merge-multiple: false
      - name: Log in to ECR and name the repository
        id: ecr
        run: |
          registry=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com
          echo "::add-mask::$registry"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          echo "repo=$registry/$REPOSITORY" >>"$GITHUB_OUTPUT"
      - name: Check that both architectures carry the same UI
        id: assets
        run: |
          if [[ ! -d builds ]]; then
            echo "No build artifacts: the commit was already released."
            echo "built=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if ! diff -u builds/build-amd64/assets-amd64.txt builds/build-arm64/assets-arm64.txt; then
            echo "::error::the amd64 and arm64 images contain different UI assets"
            exit 1
          fi
          echo "built=true" >>"$GITHUB_OUTPUT"
      - name: Merge into one multi-arch tag
        if: steps.assets.outputs.built == 'true'
        env:
          REPO: ${{ steps.ecr.outputs.repo }}
        run: |
          amd64=$(cat builds/build-amd64/digest-amd64)
          arm64=$(cat builds/build-arm64/digest-arm64)
          docker buildx imagetools create --tag "${REPO}:sha-${GITHUB_SHA}" "${REPO}@${amd64}" "${REPO}@${arm64}"
      - name: Read the merged digest
        id: publish
        env:
          REPO: ${{ steps.ecr.outputs.repo }}
        run: |
          digest=$(docker buildx imagetools inspect "${REPO}:sha-${GITHUB_SHA}" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "could not read the digest of sha-${GITHUB_SHA}" >&2; exit 1; }
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          # deploy-app.yml has no ECR access, so it reads the digest from this artifact.
          printf '%s\n' "$digest" >"$RUNNER_TEMP/digest.txt"
          {
            echo "### Image"
            echo
            echo "- tag: \`sha-${GITHUB_SHA}\`"
            echo "- digest: \`$digest\`"
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest
          path: ${{ runner.temp }}/digest.txt
          retention-days: 14
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
      # The gate runs on the digest that was pushed, not on a local build of the same source.
      - name: Trivy scan of the pushed digest
        env:
          REPO: ${{ steps.ecr.outputs.repo }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          TRIVY_USERNAME=AWS TRIVY_PASSWORD=$(aws ecr get-login-password) \
            trivy image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 "${REPO}@${DIGEST}"

  # Copies the merged multi-arch index from ECR to GHCR without changing it, so the digest that
  # deploys on AWS is the digest the Azure and GCP clusters pull. A failure here shows as a failed
  # job and leaves the release green, because deploy-app reads this workflow's conclusion.
  publish-ghcr:
    needs: merge
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      id-token: write
      contents: read
      packages: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      DIGEST: ${{ needs.merge.outputs.digest }}
    steps:
      - name: Install crane
        run: |
          url="https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/crane.tar.gz" "$url"
          echo "${CRANE_SHA256}  $RUNNER_TEMP/crane.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/crane-bin"
          tar -xzf "$RUNNER_TEMP/crane.tar.gz" -C "$RUNNER_TEMP/crane-bin" crane
          echo "$RUNNER_TEMP/crane-bin" >>"$GITHUB_PATH"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      - name: Log in to ECR and GHCR
        id: registries
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          registry=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com
          echo "::add-mask::$registry"
          aws ecr get-login-password | crane auth login "$registry" --username AWS --password-stdin
          crane auth login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$GITHUB_TOKEN"
          echo "source=$registry/$REPOSITORY" >>"$GITHUB_OUTPUT"
          echo "target=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"
      - name: Copy the index and check the digest
        env:
          SOURCE: ${{ steps.registries.outputs.source }}
          TARGET: ${{ steps.registries.outputs.target }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no merged digest to publish"; exit 1; }
          tag="${TARGET}:sha-${GITHUB_SHA}"
          existing=$(crane digest "$tag" 2>/dev/null || true)
          if [[ -n "$existing" && "$existing" != "$DIGEST" ]]; then
            echo "::error::${tag} already points at ${existing}, not ${DIGEST}; it is not overwritten"
            exit 1
          fi
          crane copy "${SOURCE}@${DIGEST}" "$tag"
          for ref in "$tag" "${TARGET}@${DIGEST}"; do
            got=$(crane digest "$ref")
            if [[ "$got" != "$DIGEST" ]]; then
              echo "::error::${ref} has digest ${got}, but ECR has ${DIGEST}"
              exit 1
            fi
          done
          echo "The digest is the same in ECR and GHCR."
          {
            echo "### GHCR"
            echo
            echo "- image: \`${TARGET}\`"
            echo "- tag: \`sha-${GITHUB_SHA}\`"
            echo "- digest: \`${DIGEST}\` (the same as in ECR)"
          } >>"$GITHUB_STEP_SUMMARY"
      # A new GHCR package starts private. The clusters pull without credentials, so this fails until
      # the package is made public once in the GitHub UI (Package settings, Change visibility).
      - name: Check that the package can be pulled anonymously
        env:
          TARGET: ${{ steps.registries.outputs.target }}
        run: |
          if ! DOCKER_CONFIG="$(mktemp -d)" crane manifest "${TARGET}@${DIGEST}" >/dev/null; then
            echo "::error::${TARGET} cannot be pulled without credentials; make the package public"
            exit 1
          fi
          echo "The package is public."
