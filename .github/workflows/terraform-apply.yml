name: terraform-apply

# Applies the cluster root, then the addons root, when Terraform changes reach `dev`. The `dev`
# environment requires a reviewer, so every apply is approved by a person. The addons root reads what
# the cluster root publishes, so it runs only after the cluster apply has succeeded in this job. Each
# step makes a fresh plan and applies that plan; no plan file is uploaded. Releases and deploys are
# separate pipelines: this one never touches the image or the chart.

on:
  push:
    branches:
      - dev
    paths:
      - "terraform/**"
  # A manual run applies the current state of `dev`: for a first apply, or to resume one that failed.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tf-modern-dev
  cancel-in-progress: false

env:
  TF_VERSION: "1.16.4"

jobs:
  apply:
    # Only `dev` is ever applied; the `dev` environment's branch rule enforces it as well.
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    environment: dev
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_owner: ${{ github.repository_owner }}
      TF_VAR_role_prefix: ${{ vars.ROLE_PREFIX }}
      TF_VAR_admin_role_arns: ${{ vars.ADMIN_ROLE_ARNS || '[]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      - name: Apply the cluster root
        env:
          TF_DIR: terraform/cluster
          TF_STATE_KEY: modern/cluster/dev.tfstate
        run: .github/scripts/terraform-ci.sh apply
      - name: Apply the addons root
        env:
          TF_DIR: terraform/addons
          TF_STATE_KEY: modern/addons/dev.tfstate
          REQUIRES_SSM: /shiptrack/modern/cluster_name
        run: .github/scripts/terraform-ci.sh apply
