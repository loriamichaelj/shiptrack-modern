{{- $ctx := dict "root" . "component" "worker-events" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shiptrack-worker-events
  labels:
    {{- include "shiptrack.labels" $ctx | nindent 4 }}
spec:
  # KEDA owns the replica count from the queue depth.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "shiptrack.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shiptrack.labels" $ctx | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: shiptrack-worker-events
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      terminationGracePeriodSeconds: {{ .Values.workerEvents.terminationGracePeriodSeconds }}
      securityContext:
        {{- include "shiptrack.podSecurityContext" . | nindent 8 }}
      topologySpreadConstraints:
        {{- include "shiptrack.topologySpread" $ctx | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "shiptrack.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["worker-events"]
          ports:
            - name: ops
              containerPort: 9090
          env:
            {{- include "shiptrack.commonEnv" . | nindent 12 }}
            {{- include "shiptrack.dbEnv" (dict "root" . "pool" .Values.workerEvents.pool) | nindent 12 }}
            - name: SHIPTRACK_EVENTS_QUEUE_URL
              value: {{ required "aws.eventsQueueUrl is required" .Values.aws.eventsQueueUrl | quote }}
            - name: SHIPTRACK_EVENT_BUS_NAME
              value: {{ .Values.aws.eventBusName | quote }}
          startupProbe:
            httpGet: { path: /healthz, port: ops }
            periodSeconds: 2
            failureThreshold: 30
          # The ops server answers 503 when the consume loop has stalled, so Kubernetes restarts it.
          livenessProbe:
            httpGet: { path: /healthz, port: ops }
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.workerEvents.resources | nindent 12 }}
          securityContext:
            {{- include "shiptrack.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            {{- include "shiptrack.tmpMount" . | nindent 12 }}
      volumes:
        {{- include "shiptrack.tmpVolume" . | nindent 8 }}
