{{- if .Values.networkPolicy.enabled }}
# Default deny for ingress. Egress is open: the VPC CNI has no FQDN egress policy (design 7.4).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shiptrack-default-deny-ingress
  labels:
    {{- include "shiptrack.labels" (dict "root" . "component" "network") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
# The ALB's network interfaces are in the VPC; the target type is ip, so they reach the pod directly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shiptrack-allow-api-from-vpc
  labels:
    {{- include "shiptrack.labels" (dict "root" . "component" "network") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - ipBlock:
            cidr: {{ required "vpcCidr is required" .Values.vpcCidr | quote }}
      ports:
        - protocol: TCP
          port: 8000
---
# The managed Prometheus scraper's network interfaces are in the VPC too.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shiptrack-allow-metrics-from-vpc
  labels:
    {{- include "shiptrack.labels" (dict "root" . "component" "network") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - ipBlock:
            cidr: {{ .Values.vpcCidr | quote }}
      ports:
        - protocol: TCP
          port: 9090
{{- end }}
