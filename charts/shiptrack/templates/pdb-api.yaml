apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shiptrack-api
  labels:
    {{- include "shiptrack.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "shiptrack.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
