{{- /* Pod Identity binds an IAM role to these names (terraform/cluster, service_accounts). */ -}}
{{- range $component := list "api" "worker-events" "worker-notify" "sla-scan" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shiptrack-{{ $component }}
  labels:
    {{- include "shiptrack.labels" (dict "root" $ "component" $component) | nindent 4 }}
automountServiceAccountToken: {{ $.Values.serviceAccount.automountToken }}
{{- end }}
{{- if .Values.migrations.enabled }}
---
# The migration Job runs before the release's other resources exist, so its service account is a
# hook too, one step ahead of the Job.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shiptrack-migrate
  labels:
    {{- include "shiptrack.labels" (dict "root" . "component" "migrate") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
{{- end }}
