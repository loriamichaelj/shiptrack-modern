# Local use only: the app, Postgres, and an AWS API emulator. Nothing here runs in AWS.
#
#   export LOCALSTACK_AUTH_TOKEN=...      # LocalStack needs an account token
#   docker compose up --build -d
#   curl localhost:8000/readyz            # the UI is at http://localhost:8000/ui/
#   docker compose down -v
#
# The emulator answers to localhost.localstack.cloud, which resolves to it inside this network and to
# 127.0.0.1 on your machine, so a presigned proof of delivery URL the API hands out opens from the host too.
# The credentials below are the emulator's throwaway values.
x-app: &app
  build: .
  image: shiptrack-modern:local
  environment: &env
    AWS_ENDPOINT_URL: http://localhost.localstack.cloud:4566
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    SHIPTRACK_DB_SECRET_ARN: shiptrack/db/app
    SHIPTRACK_DB_MIGRATOR_SECRET_ARN: shiptrack/db/migrator
    SHIPTRACK_DB_SSLMODE: disable
    SHIPTRACK_EVENTS_QUEUE_URL: http://localhost.localstack.cloud:4566/000000000000/shiptrack-carrier-events
    SHIPTRACK_NOTIFY_QUEUE_URL: http://localhost.localstack.cloud:4566/000000000000/shiptrack-notifications
    SHIPTRACK_EVENT_BUS_NAME: shiptrack
    SHIPTRACK_POD_BUCKET: shiptrack-pod
  depends_on:
    init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shiptrack
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shiptrack"]
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    image: localstack/localstack:latest
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?set LOCALSTACK_AUTH_TOKEN}
      SERVICES: sqs,s3,secretsmanager,events
    networks:
      default:
        aliases:
          - localhost.localstack.cloud
    ports:
      - "127.0.0.1:4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/health"]
      interval: 3s
      timeout: 3s
      retries: 30

  init:
    image: amazon/aws-cli:latest
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      AWS_ENDPOINT_URL: http://localhost.localstack.cloud:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - ./scripts/local-init.sh:/init.sh:ro
    depends_on:
      localstack:
        condition: service_healthy

  migrate:
    <<: *app
    command: ["migrate"]
    environment:
      <<: *env
      SHIPTRACK_MIGRATIONS_ENABLED: "true"
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["api"]
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:9090:9090"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker-events:
    <<: *app
    command: ["worker-events"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker-notify:
    <<: *app
    command: ["worker-notify"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The GCP ports' emulators, for the tests only (profile `gcp`): the app does not run against them.
  #
  #   docker compose --profile gcp up -d pubsub gcs
  #   PUBSUB_EMULATOR_HOST=127.0.0.1:8085 STORAGE_EMULATOR_HOST=http://127.0.0.1:4443 uv run pytest
  pubsub:
    profiles: ["gcp"]
    image: thekevjames/gcloud-pubsub-emulator@sha256:39d3670ed7900ed68a799ed1e000ab9ec6b1d47e9cd3251be30199a5af8366d2
    environment:
      PUBSUB_PROJECT1: proj,seed
    ports:
      - "127.0.0.1:8085:8681"

  gcs:
    profiles: ["gcp"]
    image: fsouza/fake-gcs-server@sha256:797ce226d62f947c009dc40246b30cfb456b8473d8241407f9d6f2c04e4d69ef
    command: ["-scheme", "http", "-port", "4443", "-public-host", "127.0.0.1:4443"]
    ports:
      - "127.0.0.1:4443:4443"
