<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>ShipTrack</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26307a"/>
      <stop offset="0.55" stop-color="#3b5bdb"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <!-- speed lines -->
  <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round">
    <line x1="5" y1="26" x2="12" y2="26"/>
    <line x1="3" y1="33" x2="12" y2="33"/>
    <line x1="6" y1="40" x2="12" y2="40"/>
  </g>
  <!-- cargo box and cab -->
  <rect x="14" y="19" width="24" height="25" rx="3" fill="#ffffff"/>
  <path d="M40 27h8.5a3 3 0 0 1 2.4 1.2l5.2 7a3 3 0 0 1 .6 1.8V44H40z" fill="#ffffff"/>
  <path d="M44 31h4.2l3.6 5H44z" fill="#3b5bdb" fill-opacity="0.85"/>
  <!-- wheels -->
  <circle cx="25" cy="46" r="6.2" fill="#ffffff" stroke="#3b5bdb" stroke-width="3"/>
  <circle cx="47" cy="46" r="6.2" fill="#ffffff" stroke="#3b5bdb" stroke-width="3"/>
</svg>
